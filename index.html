<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>SuperLotto Number Generator</title>
    <link href="style.css" rel="stylesheet">
  </head>
  <body>
    <div class="container">
      <div class="row">
        <div class="col-10 offset-1 draw-cards">
          <div class="card text-center superlotto default" style="border-top: 10px solid #ffd200">
            <div class="card-header">
              <img src="images/SuperLottoPlus_4C_Vert_2016.png" class="card-img-top" alt="SuperLotto Plus, calottery"/>
            </div>
            <div class="card-body d-flex justify-content-center">
                <p class="draw-cards--text">Winning Number Picker!</p>
                <hr>
                <ul class="list-inline draw-cards--winning-numbers">
                  <li id="num1" class="list-inline-item">L</li>
                  <li id="num2" class="list-inline-item">U</li>
                  <li id="num3" class="list-inline-item">C</li>
                  <li id="num4" class="list-inline-item">K</li>
                  <li id="num5" class="list-inline-item">Y</li>
                  <li id="mega" class="list-inline-item" style="background-color: #007FB0;border-color: #007FB0;color: #ffffff;">!</li>
                </ul>
                <hr>
            </div>
            <div class="card-footer">
              <button class="btn btn-primary" id="drawButton">I'm Feeling Lucky</button>
            </div>
            <p class="small">Game Rules<br/>5 unique numbers between 1 and 47<br/>1 Mega number between 1 and 27</p>
          </div>
        </div>
      </div>
    </div>
    <script src="script.js" type="text/javascript"></script>
  </body>
</html>
